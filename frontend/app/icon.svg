<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 46" fill="none">
  <defs>
    <linearGradient id="bsGlass" x1="8" y1="5" x2="38" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="0.22" stop-color="#E4007C" stop-opacity="0.14" />
      <stop offset="0.65" stop-color="#E4007C" stop-opacity="0.04" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="bsEdge" x1="5" y1="5" x2="39" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="0.25" stop-color="#FF4BA8" />
      <stop offset="0.65" stop-color="#E4007C" />
      <stop offset="1" stop-color="#8A004D" />
    </linearGradient>
    <linearGradient id="bsReflection" x1="10" y1="8" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="bsGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="bsShadow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#E4007C" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ambient glow behind the lens -->
  <circle cx="19" cy="19" r="15" fill="#E4007C" opacity="0.12" filter="url(#bsGlow)" />

  <!-- Outer glass ring -->
  <circle cx="19" cy="19" r="14" fill="url(#bsGlass)" stroke="url(#bsEdge)" stroke-width="2.2" filter="url(#bsShadow)" />

  <!-- Inner glass ring -->
  <circle cx="19" cy="19" r="10.5" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.8" />

  <!-- Glass reflection -->
  <path d="M10.5 15.5C12.2 10.8 15.2 8.2 19.7 7.7" stroke="url(#bsReflection)" stroke-width="2" stroke-linecap="round" />

  <!-- THE BLIND SPOT -->
  <circle cx="23" cy="15" r="3" fill="#FFFFFF" fill-opacity="0.95" />
  <circle cx="23" cy="15" r="5" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.8" />

  <!-- Lens depth accent -->
  <path d="M11.5 24.5C14.2 27.2 18.1 28.5 22 27.7" stroke="#E4007C" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round" />

  <!-- Handle -->
  <path d="M29.5 29.5L38 38" stroke="url(#bsEdge)" stroke-width="4.5" stroke-linecap="round" filter="url(#bsShadow)" />

  <!-- Handle highlight -->
  <path d="M30.7 30.7L36.7 36.7" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round" />

  <!-- Tiny endpoint -->
  <circle cx="38" cy="38" r="1.2" fill="#FFFFFF" fill-opacity="0.4" />
</svg>
